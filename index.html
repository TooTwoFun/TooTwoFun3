<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d"><title>TooTwoFun — Watch, Create, Share</title>
<style>
:root{--pink:#ff315b;--cyan:#21d6cf;--bg:#09090d}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,Arial,sans-serif}body{overflow:hidden}.app{height:100dvh;max-width:520px;margin:auto;position:relative;background:#111;overflow:hidden}.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#000b,transparent)}.logo{position:absolute;left:15px;font-size:19px;font-weight:900;letter-spacing:-.8px}.logo b{color:var(--pink)}.tabs{display:flex;gap:24px;font-weight:750;font-size:14px}.tabs button{border:0;background:none;color:#ffffff9c;padding:7px 0;font:inherit}.tabs button.active{color:white;border-bottom:2px solid white}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.post{height:100%;min-height:100%;position:relative;scroll-snap-align:start;background:#202027}.post video{height:100%;width:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0007,transparent 23%,transparent 54%,#000b 100%);pointer-events:none}.post-info{position:absolute;left:16px;right:82px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:2;text-shadow:0 1px 4px #000}.handle{font-weight:800;margin-bottom:9px}.caption{font-size:14px;line-height:1.45}.sound{margin-top:9px;font-size:12px;opacity:.9}.actions{position:absolute;right:12px;bottom:calc(105px + env(safe-area-inset-bottom));z-index:3;display:flex;flex-direction:column;align-items:center;gap:20px}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--cyan));font-weight:900;border:2px solid white}.act{border:0;background:none;color:white;padding:0;min-width:44px;font-size:27px;text-shadow:0 1px 5px #000}.act small{display:block;font-size:11px;margin-top:3px;text-align:center}.act.liked{color:var(--pink)}.bottom{position:absolute;z-index:6;bottom:0;left:0;right:0;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;background:#09090df2;border-top:1px solid #ffffff16}.nav{color:#ddd;text-decoration:none;text-align:center;font-size:10px;min-width:52px}.nav b{display:block;font-size:21px;margin-bottom:2px;font-weight:500}.nav.active{color:white}.create{display:inline-grid;place-items:center;background:white;color:#111;border-radius:9px;width:42px;height:29px;font-size:25px!important;font-weight:700!important}.notice{position:absolute;z-index:10;left:50%;bottom:85px;transform:translateX(-50%);background:#24242b;padding:10px 15px;border-radius:22px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}.notice.show{opacity:1}.empty{display:grid;place-items:center;height:100%;padding:30px;text-align:center;color:#ddd}
</style></head>
<body><div class="app">
<header class="top"><div class="logo">TooTwo<b>Fun</b></div><div class="tabs"><button id="following">Following</button><button id="forYou" class="active">For You</button></div></header>
<main class="feed" id="feed">
<section class="post"><video src="https://videos.pexels.com/video-files/854451/854451-hd_1920_1080_25fps.mp4" muted playsinline loop autoplay preload="metadata"></video><div class="shade"></div><div class="post-info"><div class="handle">@tootwofun_official</div><div class="caption">Welcome to TooTwoFun ✨ Your place to watch, create and share videos.</div><div class="sound">♫ Original sound — TooTwoFun</div></div><div class="actions"><div class="avatar">T</div><button class="act like" aria-label="Like">♡<small>Like</small></button><button class="act comment" aria-label="Comment">▢<small>Comment</small></button><button class="act share" aria-label="Share">↗<small>Share</small></button></div></section>
<section class="post"><video src="https://videos.pexels.com/video-files/3129671/3129671-hd_1920_1080_25fps.mp4" muted playsinline loop preload="metadata"></video><div class="shade"></div><div class="post-info"><div class="handle">@fun_videos</div><div class="caption">Every moment has a story. Share yours with the TooTwoFun community 🌿</div><div class="sound">♫ Original sound</div></div><div class="actions"><div class="avatar">F</div><button class="act like" aria-label="Like">♡<small>Like</small></button><button class="act comment" aria-label="Comment">▢<small>Comment</small></button><button class="act share" aria-label="Share">↗<small>Share</small></button></div></section>
</main>
<nav class="bottom"><a class="nav active" href="#" data-nav="Home"><b>⌂</b>Home</a><a class="nav" href="#" data-nav="Discover"><b>⌕</b>Discover</a><a class="nav" href="#" data-nav="Create"><b class="create">＋</b>Create</a><a class="nav" href="#" data-nav="Inbox"><b>✉</b>Inbox</a><a class="nav" href="#" data-nav="Profile"><b>◉</b>Profile</a></nav><div class="notice" id="notice"></div></div>
<script>
const videos=[...document.querySelectorAll('video')],notice=document.getElementById('notice');let noticeTimer;
function toast(msg){notice.textContent=msg;notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),1900)}
const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){videos.forEach(v=>{if(v===e.target)v.play().catch(()=>{});else v.pause()})}}),{threshold:.65});videos.forEach(v=>observer.observe(v));
document.querySelectorAll('.like').forEach(b=>b.addEventListener('click',()=>{const liked=b.classList.toggle('liked');b.innerHTML=liked?'♥<small>Liked</small>':'♡<small>Like</small>'}));
document.querySelectorAll('.comment').forEach(b=>b.addEventListener('click',()=>toast('Comments will be available when accounts are connected.')));
document.querySelectorAll('.share').forEach(b=>b.addEventListener('click',async()=>{try{if(navigator.share)await navigator.share({title:'TooTwoFun',url:location.href});else{await navigator.clipboard.writeText(location.href);toast('Link copied!')}}catch(e){}}));
document.querySelectorAll('[data-nav]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('active'));a.classList.add('active');const name=a.dataset.nav;if(name!=='Home')toast(name+' page is coming next.');}));
document.getElementById('following').addEventListener('click',()=>toast('Follow creators to build your Following feed.'));
document.getElementById('forYou').addEventListener('click',()=>{document.getElementById('feed').scrollTo({top:0,behavior:'smooth'});});
</script></body></html>
