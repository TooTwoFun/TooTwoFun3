<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TooTwoFun</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}
.app{height:100dvh;max-width:520px;margin:auto;background:#111;position:relative;overflow:hidden}
.top{position:absolute;z-index:5;top:0;width:100%;display:flex;align-items:center;justify-content:center;padding:18px 12px;background:linear-gradient(#0009,transparent)}
.brand{position:absolute;left:14px;font-weight:900;font-size:19px;letter-spacing:-.5px}.brand span{color:#ff3158}
.tabs{display:flex;gap:22px;font-size:15px;font-weight:700}.tabs span{opacity:.65}.tabs .active{opacity:1;border-bottom:2px solid white;padding-bottom:5px}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}
.video-card{height:100dvh;position:relative;scroll-snap-align:start;background:#222}.video-card video{width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:linear-gradient(transparent 55%,#0009 100%);pointer-events:none}
.info{position:absolute;bottom:82px;left:15px;right:76px;z-index:2;text-shadow:0 1px 3px #000}.user{font-weight:bold;margin-bottom:9px}.caption{font-size:14px;line-height:1.4}
.actions{position:absolute;right:12px;bottom:105px;z-index:3;display:flex;flex-direction:column;gap:22px;align-items:center}.action{border:0;background:none;color:white;font-size:25px;cursor:pointer;text-shadow:0 1px 5px #000}.action small{display:block;font-size:11px;text-align:center;margin-top:3px}.avatar{width:43px;height:43px;border-radius:50%;background:linear-gradient(135deg,#ff3158,#24d6ce);display:grid;place-items:center;font-weight:900;border:2px solid white}
.bottom{position:absolute;bottom:0;z-index:5;width:100%;height:62px;background:#090909ed;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #ffffff15}.nav{color:#ddd;text-decoration:none;text-align:center;font-size:10px}.nav b{display:block;font-size:20px;margin-bottom:3px}.create{background:white;color:#111;border-radius:9px;padding:0 14px;font-size:23px}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand">TooTwo<span>Fun</span></div><div class="tabs"><span>Following</span><span class="active">For You</span></div></header>
<main class="feed" id="feed">
<section class="video-card"><video src="https://videos.pexels.com/video-files/854451/854451-hd_1920_1080_25fps.mp4" loop muted playsinline autoplay></video><div class="overlay"></div><div class="info"><div class="user">@welcome_to_to2fun</div><div class="caption">Welcome to TooTwoFun ✨ Discover your next favorite video!</div></div><div class="actions"><div class="avatar">T</div><button class="action like">♡<small>Like</small></button><button class="action">▢<small>Comment</small></button><button class="action" onclick="shareVideo()">↗<small>Share</small></button></div></section>
<section class="video-card"><video src="https://videos.pexels.com/video-files/3129671/3129671-hd_1920_1080_25fps.mp4" loop muted playsinline></video><div class="overlay"></div><div class="info"><div class="user">@fun_videos</div><div class="caption">Enjoy the moment 🌿</div></div><div class="actions"><div class="avatar">F</div><button class="action like">♡<small>Like</small></button><button class="action">▢<small>Comment</small></button><button class="action" onclick="shareVideo()">↗<small>Share</small></button></div></section>
</main>
<nav class="bottom"><a class="nav" href="#"><b>⌂</b>Home</a><a class="nav" href="#"><b>⌕</b>Discover</a><a class="nav" href="#"><b class="create">＋</b>Create</a><a class="nav" href="#"><b>✉</b>Inbox</a><a class="nav" href="#"><b>◉</b>Profile</a></nav>
</div>
<script>
const videos=[...document.querySelectorAll('video')];
const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){videos.forEach(v=>{if(v===e.target)v.play().catch(()=>{});else v.pause()})}}),{threshold:.65});
videos.forEach(v=>observer.observe(v));
document.querySelectorAll('.like').forEach(b=>b.onclick=()=>{b.innerHTML=b.innerHTML.startsWith('♡')?'♥<small>Liked</small>':'♡<small>Like</small>';b.style.color=b.innerHTML.startsWith('♥')?'#ff3158':'white'});
function shareVideo(){if(navigator.share)navigator.share({title:'TooTwoFun',url:location.href}).catch(()=>{});else alert('Share TooTwoFun with your friends!')}
</script></body></html>
